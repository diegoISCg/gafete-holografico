<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gafete AR | Bodega Ramírez</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091324;font-family:Arial,sans-serif}#status{position:fixed;z-index:50;left:12px;right:12px;top:12px;padding:12px;color:#fff;text-align:center;background:#071c35dd;border:1px solid #39dfff;border-radius:10px;font-size:14px;pointer-events:none}.a-enter-vr,.a-enter-ar,.a-enter-vr-button{display:none!important}</style></head><body>
<div id="status">Buscando marcador HIRO…<br><small>Apunta la cámara al marcador completo.</small></div>
<a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true; alpha: true" loading-screen="enabled:false">
<a-marker id="marker" preset="hiro" emitevents="true"><a-entity id="holder" position="0 0.12 0" rotation="-90 0 0"><a-plane id="card" width="1.7" height="1.65" material="side:double;transparent:true;depthWrite:false"></a-plane></a-entity></a-marker><a-entity camera></a-entity></a-scene>
<script>
(function(){
const marker=document.getElementById('marker'), holder=document.getElementById('holder'), status=document.getElementById('status');
const canvas=document.createElement('canvas');canvas.width=1024;canvas.height=1024;const ctx=canvas.getContext('2d');
function text(s,y,size,color){ctx.fillStyle=color;ctx.font='bold '+size+'px Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=color;ctx.shadowBlur=12;ctx.fillText(s,512,y,950);ctx.shadowBlur=0;}
function draw(t){const w=1024,h=1024;ctx.clearRect(0,0,w,h);ctx.fillStyle='rgba(3,18,44,0.88)';ctx.fillRect(20,20,984,984);ctx.strokeStyle='#45eaff';ctx.lineWidth=12;ctx.shadowColor='#45eaff';ctx.shadowBlur=18;ctx.strokeRect(26,26,972,972);ctx.shadowBlur=0;
ctx.fillStyle='#ffd22b';ctx.fillRect(38,44,948,12);text('BODEGA RAMIREZ',135,57,'#ffd22b');
ctx.strokeStyle='#39e6ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(110,205);ctx.lineTo(914,205);ctx.stroke();
text('DIEGO GARCIA CASTILLO',285,57,'#ffffff');text('AREA: SISTEMAS',400,55,'#48eaff');
text('EDAD: 28 ANOS',535,53,'#ffffff');text('TIPO DE SANGRE: O+',655,53,'#ffffff');text('INGRESO: 16/DIC/2026',775,49,'#ffffff');
const y=850+(t%2400)/2400*95;ctx.fillStyle='rgba(64,238,255,0.28)';ctx.fillRect(48,y,928,16);ctx.fillStyle='#43edff';ctx.fillRect(48,y+5,928,4);text('IDENTIFICACION HOLOGRAFICA',955,32,'#50eaff');}
let texture, plane, ready=false;
function setup(){if(ready||!window.THREE)return;plane=document.getElementById('card');if(!plane.object3D)return;draw(0);texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;const mesh=plane.getObject3D('mesh');if(!mesh)return;mesh.material=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide,depthWrite:false});ready=true;}
document.querySelector('a-scene').addEventListener('loaded',setup);document.getElementById('card').addEventListener('loaded',setup);
marker.addEventListener('markerFound',()=>{status.textContent='HIRO detectado · Datos holograficos activos';});marker.addEventListener('markerLost',()=>{status.textContent='Buscando marcador HIRO…';});
function tick(t){if(!ready)setup();if(ready&&marker.object3D.visible){draw(t);texture.needsUpdate=true;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
})();
</script></body></html>

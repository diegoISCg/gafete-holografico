<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gafete AR | Bodega Ramírez</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
#hint{position:fixed;top:12px;left:12px;right:12px;z-index:10;background:rgba(4,21,40,.88);color:white;padding:12px;border:1px solid #4bdcff;border-radius:10px;text-align:center;font-size:14px;pointer-events:none}
#hint small{display:block;color:#a8dcea;margin-top:4px}
</style>
</head>
<body>
<div id="hint">Apunta al marcador HIRO impreso en el reverso del gafete<small>Permite la cámara y mantén el marcador completo y bien iluminado.</small></div>
<a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;antialias:true;alpha:true" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;" >
  <a-marker preset="hiro" id="badgeMarker" emitevents="true">
    <!-- Tarjeta horizontal sobre el marcador, elevada para evitar parpadeo. -->
    <a-entity id="hologram" position="0 0.16 0" rotation="-90 0 0" scale="0.001 0.001 0.001"
      animation__open="property:scale;to:1 1 1;dur:850;easing:easeOutBack;startEvents:openHologram"
      animation__close="property:scale;to:0.001 0.001 0.001;dur:250;startEvents:closeHologram">
      <a-plane width="1.5" height="1.5" material="color:#061b34;opacity:0.88;transparent:true;side:double" position="0 0 0"></a-plane>
      <a-plane width="1.49" height="0.012" position="0 0.73 0.012" material="color:#4deaff;shader:flat"></a-plane>
      <a-plane width="1.49" height="0.012" position="0 -0.73 0.012" material="color:#4deaff;shader:flat"></a-plane>
      <a-plane width="0.012" height="1.47" position="-0.73 0 0.012" material="color:#4deaff;shader:flat"></a-plane>
      <a-plane width="0.012" height="1.47" position="0.73 0 0.012" material="color:#4deaff;shader:flat"></a-plane>
      <a-text value="BODEGA RAMIREZ" align="center" color="#57eeff" width="2.4" position="0 0.55 0.055" side="double"></a-text>
      <a-text value="IDENTIFICACION DIGITAL" align="center" color="#a5e8ff" width="1.7" position="0 0.37 0.055" side="double"></a-text>
      <a-text value="DIEGO GARCIA CASTILLO" align="center" color="#ffffff" width="1.85" position="0 0.16 0.055" side="double"></a-text>
      <a-text value="AREA: SISTEMAS" align="center" color="#57eeff" width="2.15" position="0 -0.05 0.055" side="double"></a-text>
      <a-text value="EDAD: 28 ANOS" align="center" color="#ffffff" width="1.95" position="0 -0.24 0.055" side="double"></a-text>
      <a-text value="TIPO DE SANGRE: O+" align="center" color="#ffffff" width="1.95" position="0 -0.41 0.055" side="double"></a-text>
      <a-text value="INGRESO: 16/DIC/2026" align="center" color="#ffffff" width="1.95" position="0 -0.58 0.055" side="double"></a-text>
      <a-plane width="1.38" height="0.018" position="0 -0.66 0.08" material="color:#49efff;opacity:0.7;transparent:true;shader:flat;depthTest:false"
        animation__scan="property:position;from:0 -0.66 0.08;to:0 0.67 0.08;dur:2400;loop:true;dir:alternate;easing:linear"></a-plane>
    </a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<script>
const marker=document.getElementById('badgeMarker');
const hologram=document.getElementById('hologram');
const hint=document.getElementById('hint');
marker.addEventListener('markerFound',()=>{
  hint.style.display='none';
  hologram.emit('openHologram');
});
marker.addEventListener('markerLost',()=>{
  hint.style.display='block';
  hologram.setAttribute('scale','0.001 0.001 0.001');
});
</script>
</body>
</html>

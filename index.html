<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gafete AR | Bodega Ramírez</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091324;font-family:Arial,sans-serif}
#status{position:fixed;z-index:50;left:12px;right:12px;top:10px;padding:8px;color:white;text-align:center;background:#071c35cc;border:1px solid #39dfff;border-radius:9px;font-size:12px;pointer-events:none}
#controls{position:fixed;z-index:60;bottom:18px;left:12px;right:12px;background:#06162de8;color:white;padding:12px;border:1px solid #39dfff;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:13px}
#size{flex:1;min-width:70px;accent-color:#42eaff}#value{min-width:43px;text-align:right;color:#ffd22b}.a-enter-vr,.a-enter-ar,.a-enter-vr-button{display:none!important}
</style>
</head>
<body>
<div id="status">Buscando marcador HIRO…</div>
<div id="controls"><label for="size">Tamaño</label><input id="size" type="range" min="0.025" max="0.30" step="0.005" value="0.09"><span id="value">0.090</span></div>
<a-scene embedded vr-mode-ui="enabled:false" arjs="sourceType:webcam;debugUIEnabled:false;" renderer="antialias:true;alpha:true" loading-screen="enabled:false">
<a-marker id="marker" preset="hiro" emitevents="true">
<a-entity id="holder" position="0 0.025 0" rotation="-90 0 0">
<a-plane id="card" width="1" height="1.30" material="side:double;transparent:true;depthWrite:false" scale="0.09 0.09 0.09"></a-plane>
</a-entity>
</a-marker><a-entity camera></a-entity>
</a-scene>
<script>
(function(){
const marker=document.getElementById('marker'), status=document.getElementById('status');
const card=document.getElementById('card'), size=document.getElementById('size'), value=document.getElementById('value');
function resize(v){const n=Number(v);card.setAttribute('scale',`${n} ${n} ${n}`);value.textContent=n.toFixed(3)}
size.addEventListener('input',()=>resize(size.value));resize(size.value);
const canvas=document.createElement('canvas');canvas.width=768;canvas.height=998;const ctx=canvas.getContext('2d');
function label(s,y,px,color){ctx.fillStyle=color;ctx.font='bold '+px+'px Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=color;ctx.shadowBlur=6;ctx.fillText(s,384,y,680);ctx.shadowBlur=0}
function draw(t){ctx.clearRect(0,0,768,998);ctx.fillStyle='rgba(3,18,44,0.86)';ctx.fillRect(12,12,744,974);ctx.strokeStyle='#45eaff';ctx.lineWidth=8;ctx.shadowColor='#45eaff';ctx.shadowBlur=12;ctx.strokeRect(18,18,732,962);ctx.shadowBlur=0;
ctx.fillStyle='#ffd22b';ctx.fillRect(30,40,708,9);label('BODEGA RAMÍREZ',110,49,'#ffd22b');
ctx.strokeStyle='#39e6ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(75,174);ctx.lineTo(693,174);ctx.stroke();
label('DIEGO GARCÍA',252,58,'#ffffff');label('CASTILLO',320,58,'#ffffff');label('ÁREA: SISTEMAS',430,51,'#48eaff');
label('EDAD: 28 AÑOS',551,47,'#ffffff');label('SANGRE: O+',658,47,'#ffffff');label('INGRESO: 16/DIC/2026',766,41,'#ffffff');
const y=829+(t%2200)/2200*70;ctx.fillStyle='rgba(64,238,255,0.28)';ctx.fillRect(35,y,698,12);ctx.fillStyle='#43edff';ctx.fillRect(35,y+4,698,3);label('IDENTIFICACIÓN AR',945,31,'#50eaff')}
let texture,ready=false;
function setup(){if(ready||!window.THREE)return;const mesh=card.getObject3D('mesh');if(!mesh)return;draw(0);texture=new THREE.CanvasTexture(canvas);if('colorSpace' in texture)texture.colorSpace=THREE.SRGBColorSpace;mesh.material=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide,depthWrite:false});ready=true}
document.querySelector('a-scene').addEventListener('loaded',setup);card.addEventListener('loaded',setup);
marker.addEventListener('markerFound',()=>status.textContent='HIRO detectado · Ajusta el tamaño con la barra inferior');
marker.addEventListener('markerLost',()=>status.textContent='Buscando marcador HIRO…');
function tick(t){if(!ready)setup();if(ready&&marker.object3D.visible){draw(t);texture.needsUpdate=true}requestAnimationFrame(tick)}requestAnimationFrame(tick)
})();
</script>
</body></html>

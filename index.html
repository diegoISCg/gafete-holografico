<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Gafete AR | Bodega Ramírez</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>body{margin:0;overflow:hidden;font-family:Arial,sans-serif}#hint{position:fixed;top:12px;left:12px;right:12px;z-index:5;background:#061c34d9;color:#fff;padding:12px;border:1px solid #4bdcff;border-radius:10px;text-align:center;font-size:14px}#hint small{display:block;color:#a8dcea;margin-top:4px}</style>
</head><body><div id="hint">Apunta al marcador HIRO impreso en el reverso del gafete<small>Permite el acceso a la cámara. Mantén el marcador completo y bien iluminado.</small></div>
<a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;antialias:true" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;" >
<a-marker preset="hiro" id="badgeMarker">
<a-entity rotation="-90 0 0" position="0 0.08 0">
<a-plane width="1.35" height="1.32" material="color:#04162e;opacity:0.78;transparent:true;side:double" animation="property:scale;from:0.02 0.02 0.02;to:1 1 1;dur:1100;easing:easeOutElastic;startEvents:showCard"></a-plane>
<a-plane width="1.38" height="0.012" position="0 0.65 0.005" material="color:#47e9ff;shader:flat" animation="property:material.opacity;from:0.4;to:1;dir:alternate;loop:true;dur:700"></a-plane>
<a-text value="BODEGA RAMIREZ" align="center" color="#57eeff" width="2.6" position="0 0.48 0.02" animation="property:material.opacity;from:0;to:1;dur:700;delay:350;startEvents:showCard"></a-text>
<a-text value="DIEGO GARCIA CASTILLO" align="center" color="#ffffff" width="1.9" position="0 0.25 0.02" animation="property:material.opacity;from:0;to:1;dur:700;delay:950;startEvents:showCard"></a-text>
<a-text value="AREA: SISTEMAS" align="center" color="#57eeff" width="2.15" position="0 0.04 0.02" animation="property:material.opacity;from:0;to:1;dur:700;delay:1500;startEvents:showCard"></a-text>
<a-text value="EDAD: 28 ANOS" align="center" color="#ffffff" width="2.2" position="0 -0.16 0.02" animation="property:material.opacity;from:0;to:1;dur:700;delay:2050;startEvents:showCard"></a-text>
<a-text value="TIPO DE SANGRE: O+" align="center" color="#ffffff" width="2.2" position="0 -0.33 0.02" animation="property:material.opacity;from:0;to:1;dur:700;delay:2600;startEvents:showCard"></a-text>
<a-text value="INGRESO: 16/DIC/2026" align="center" color="#ffffff" width="2.2" position="0 -0.50 0.02" animation="property:material.opacity;from:0;to:1;dur:700;delay:3150;startEvents:showCard"></a-text>
<a-plane width="1.3" height="0.025" position="0 -0.62 0.03" material="color:#44eeff;opacity:0.85;transparent:true" animation="property:position;from:0 -0.62 0.03;to:0 0.61 0.03;dur:2200;loop:true;dir:alternate;easing:linear"></a-plane>
</a-entity></a-marker><a-entity camera></a-entity></a-scene>
<script>const marker=document.querySelector('#badgeMarker');marker.addEventListener('markerFound',()=>{document.querySelector('#hint').style.display='none';document.querySelectorAll('[animation]').forEach(el=>{el.emit('showCard')})});marker.addEventListener('markerLost',()=>{document.querySelector('#hint').style.display='block'})</script>
</body></html>
